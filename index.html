<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Map Editor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #222;
            color: #eee;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 90vh;
            overflow-y: auto;
        }
        #pixi-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        h3 { margin: 0 0 5px 0; font-size: 14px; color: #aaa; }
        label { font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        input[type="file"] { font-size: 12px; }
        button { background: #444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #555; }
        #status { font-size: 12px; color: #ffeb3b; margin-top: 5px; word-wrap: break-word; max-width: 250px; }

        /* Tool panels */
        #tools, #properties {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        #tools {
            top: 10px;
            right: 10px;
            width: 300px;
            max-height: 50vh;
            overflow-y: auto;
        }

        #properties {
            bottom: 10px;
            right: 10px;
            width: 300px;
            max-height: 40vh;
            overflow-y: auto;
        }

        #minimap-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #minimap-canvas {
            border: 1px solid #555;
            background: #000;
            cursor: pointer;
        }

        .palette-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .palette-item {
            width: 48px;
            height: 32px;
            background: #333;
            border: 1px solid #555;
            cursor: pointer;
            position: relative;
        }
        .palette-item.selected {
            border-color: #ffeb3b;
            box-shadow: 0 0 5px #ffeb3b;
        }
        .palette-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            margin: auto;
        }

        select { background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        .flex-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .flex-row input[type="number"] { width: 50px; background: #333; color: white; border: 1px solid #555; padding: 2px; }
    </style>
    <!-- Include pako for gzip decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- Include PixiJS (v7) for WebGL rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
</head>
<body>
    <div id="ui">
        <div class="control-group">
            <h3>Files</h3>
            <label>Load Map (.map) <input type="file" id="fileMap" accept=".map" /></label>
            <label>Load Libs (.lib) <input type="file" id="fileLibs" accept=".lib" multiple /></label>
        </div>
        <div class="control-group">
            <h3>Layers</h3>
            <label><input type="checkbox" id="chkBack" checked> Background</label>
            <label><input type="checkbox" id="chkMidd" checked> Middle</label>
            <label><input type="checkbox" id="chkFront" checked> Foreground</label>
            <label><input type="checkbox" id="chkGrid"> Grid</label>
        </div>
        <div id="status">Ready</div>
        <button id="btnSaveMap" style="margin-top: 10px;">Export Map</button>
    </div>

    <!-- Tools Panel -->
    <div id="tools">
        <h3>Paint Palette</h3>
        <label>Active Layer:
            <select id="selActiveLayer">
                <option value="back">Background</option>
                <option value="middle">Middle</option>
                <option value="front">Foreground</option>
            </select>
        </label>
        <label>Library:
            <select id="selLib">
                <option value="-1">-- None --</option>
            </select>
        </label>
        <button id="btnLoadPalette">Load Palette Images</button>
        <div id="palette" class="palette-container"></div>
    </div>

    <!-- Properties Panel -->
    <div id="properties">
        <h3>Cell Properties</h3>
        <div id="cellPropInfo" style="font-size: 12px; margin-bottom: 5px;">Select a cell...</div>
        <div class="flex-row"><label>Door Index</label><input type="number" id="propDoorIndex" min="0" max="255"></div>
        <div class="flex-row"><label>Door Offset</label><input type="number" id="propDoorOffset" min="0" max="255"></div>
        <div class="flex-row"><label>Light</label><input type="number" id="propLight" min="0" max="255"></div>
        <div class="flex-row"><label>Front Anim Frame</label><input type="number" id="propFrontAnimFrame" min="0" max="255"></div>
        <div class="flex-row"><label>Front Anim Tick</label><input type="number" id="propFrontAnimTick" min="0" max="255"></div>
        <button id="btnApplyProps">Apply to Selection</button>
    </div>

    <!-- Minimap Panel -->
    <div id="minimap-container">
        <h3>Radar</h3>
        <canvas id="minimap-canvas" width="200" height="200"></canvas>
    </div>

    <div id="pixi-container"></div>

    <script src="src/MLibrary.js"></script>
    <script src="src/MapReader.js"></script>
    <script src="src/Renderer.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
